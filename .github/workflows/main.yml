name: Tactical Python Execution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Fallback eksekusi terjadwal otomatis (Midnight UTC)
  workflow_dispatch: # Parameter krusial untuk memaksa GitHub memunculkan tombol "Run workflow"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-scripts:
    name: Run Primary Scripts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Initialize Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Dependency Injection
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Target (rotate_tools.py)
        run: |
          python rotate_tools.py
